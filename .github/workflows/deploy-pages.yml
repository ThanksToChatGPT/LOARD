name: Publicar prototipo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_DIR: Hito 2/Modulo-I-Prototipo/prototipo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          # El sitio se publica en https://<usuario>.github.io/<repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback para rutas del SPA
        # GitHub Pages devuelve 404.html en rutas desconocidas (p. ej. al recargar /LOARD/cortes);
        # así React Router recibe la ruta y la resuelve.
        run: cp "$APP_DIR/dist/index.html" "$APP_DIR/dist/404.html"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
